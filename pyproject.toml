[project]
name = "sentinel-fraud-mlops"
version = "0.1.0"
description = "Production-shape real-time fraud detection: champion/challenger MLOps, sub-100ms inference, drift detection, adversarial eval."
authors = [{ name = "Hugo Correia", email = "Hugocorreia55@hotmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

dependencies = [
    # Data + features
    "polars>=1.12.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    # Models
    "lightgbm>=4.5.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    # MLOps
    "mlflow>=2.16.0",
    # Serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Feature store
    "redis>=5.0.0",
    "hiredis>=3.0.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    "evidently>=0.4.30",
    # Utilities
    "httpx>=0.27.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "kaggle>=2.2.1",
    "optuna>=4.9.0",
    "optuna-integration[mlflow]>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

load_test = [
    "locust>=2.31.0",
]

control_panel = [
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
